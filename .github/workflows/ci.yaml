name: CI
on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: brewgo_test
          MYSQL_USER: brewgo
          MYSQL_PASSWORD: test-db-password
          MYSQL_ROOT_PASSWORD: test-db-root-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -u brewgo -ptest-db-password brewgo_test -e 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:${{ job.services.mysql.ports[3306] }}/brewgo_test
          SPRING_DATASOURCE_USERNAME: brewgo
          SPRING_DATASOURCE_PASSWORD: test-db-password
