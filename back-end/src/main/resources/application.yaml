spring:
  application:
    name: brewgo-api
  config:
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  profiles:
    default: ${BREWGO_PROFILE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:brewgo_db}}
    username: ${MYSQL_USER:}
    password: ${MYSQL_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
