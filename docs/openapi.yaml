openapi: 3.1.0
info:
  title: BrewGo API
  version: 0.1.0
servers:
  - url: /api
paths:
  /branches:
    get:
      operationId: listBranches
      responses:
        '200':
          description: Active branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Branch'
  /categories:
    get:
      operationId: listCategories
      responses:
        '200':
          description: Active categories in menu order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /products:
    get:
      operationId: listProducts
      parameters:
        - name: branchId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: categoryId
          in: query
          schema: { type: integer, format: int64, minimum: 1 }
        - name: q
          in: query
          description: Case-insensitive search by product name
          schema: { type: string, maxLength: 120 }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Page of active products in active categories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: Invalid query parameter
        '404':
          description: Branch is unavailable
  /products/{identifier}:
    get:
      operationId: getProduct
      parameters:
        - name: identifier
          in: path
          required: true
          description: Product slug or numeric ID
          schema: { type: string, maxLength: 180 }
      responses:
        '200':
          description: Details for an active product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product is unavailable
  /admin/products:
    get:
      operationId: listAdminProducts
      security: [{ staffSession: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        '200':
          description: Product page including disabled products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
        '401': { description: Staff sign-in required }
        '403': { description: Administrator access required }
    post:
      operationId: createProduct
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example: { categoryId: 1, name: Vanilla Cold Brew, slug: vanilla-cold-brew, basePrice: '3.50' }
      responses:
        '201':
          description: Product created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '400': { description: Invalid product fields }
        '403': { description: Administrator access and a CSRF token are required }
        '409': { description: Product slug already in use }
        '422': { description: Invalid category, currency or image URL }
  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      operationId: getAdminProduct
      security: [{ staffSession: [] }]
      responses:
        '200':
          $ref: '#/components/responses/AdminProduct'
        '401': { description: Staff sign-in required }
        '403': { description: Administrator access required }
        '404': { description: Product does not exist }
    patch:
      operationId: updateProduct
      description: Omitted or null fields retain their values. Use an empty string to clear the description, allergens or image URL.
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
            example: { basePrice: '3.75', active: true }
      responses:
        '200':
          $ref: '#/components/responses/AdminProduct'
        '400': { description: Invalid product fields }
        '403': { description: Administrator access and a CSRF token are required }
        '404': { description: Product does not exist }
        '409': { description: Product slug already in use }
        '422': { description: Invalid name, category, currency or image URL }
    delete:
      operationId: deleteProduct
      description: Disable the product and preserve references from past orders.
      security: [{ staffSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204': { description: Product disabled }
        '403': { description: Administrator access and a CSRF token are required }
        '404': { description: Product does not exist }
  /auth/login:
    post:
      operationId: staffLogin
      parameters:
        - $ref: '#/components/parameters/Csrf'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '204':
          description: Signed in and session cookie issued
        '401':
          description: Invalid credentials
        '403':
          description: Invalid or missing CSRF token
  /auth/me:
    get:
      operationId: getStaffSession
      description: Obtain a fresh CSRF token and check the current staff session.
      responses:
        '200':
          description: Signed-in staff profile
          headers:
            X-CSRF-TOKEN:
              $ref: '#/components/headers/Csrf'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          description: Staff sign-in required. A session cookie is issued for the CSRF token.
          headers:
            X-CSRF-TOKEN:
              $ref: '#/components/headers/Csrf'
  /auth/logout:
    post:
      operationId: staffLogout
      security:
        - staffSession: []
      parameters:
        - $ref: '#/components/parameters/Csrf'
      responses:
        '204':
          description: Session invalidated
        '403':
          description: Invalid or missing CSRF token
components:
  responses:
    AdminProduct:
      description: Product with its availability status
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminProduct'
  securitySchemes:
    staffSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
  headers:
    Csrf:
      description: Send this value in X-CSRF-TOKEN for the next staff session mutation.
      schema: { type: string }
  parameters:
    Csrf:
      name: X-CSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
  schemas:
    Branch:
      type: object
      required: [id, name, slug, timezone, address, payOnPickup]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        timezone: { type: string }
        address: { type: [string, 'null'] }
        payOnPickup: { type: boolean }
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
    Product:
      type: object
      required: [id, categoryId, name, slug, description, allergens, imageUrl, basePrice, currency]
      properties:
        id: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string }
        description: { type: [string, 'null'] }
        allergens: { type: [string, 'null'] }
        imageUrl: { type: [string, 'null'] }
        basePrice: { type: string, example: '2.50' }
        currency: { type: string, example: USD }
    ProductPage:
      type: object
      required: [items, page, totalPages, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        page: { type: integer }
        totalPages: { type: integer }
        totalItems: { type: integer, format: int64 }
    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          required: [active]
          properties:
            active: { type: boolean }
    AdminProductPage:
      allOf:
        - $ref: '#/components/schemas/ProductPage'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminProduct'
    ProductInput:
      type: object
      properties:
        categoryId: { type: [integer, 'null'], format: int64, minimum: 1 }
        name: { type: [string, 'null'], maxLength: 160 }
        slug: { type: [string, 'null'], maxLength: 180, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
        description: { type: [string, 'null'], maxLength: 16000 }
        allergens: { type: [string, 'null'], maxLength: 255 }
        imageUrl: { type: [string, 'null'], maxLength: 1024 }
        basePrice:
          description: Nonnegative decimal with up to 8 whole digits and 2 decimal places
          type: [string, number, 'null']
          example: '3.50'
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$', example: USD }
        active: { type: [boolean, 'null'] }
    ProductCreate:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [categoryId, name, slug, basePrice]
          properties:
            categoryId: { type: integer }
            name: { type: string, minLength: 1 }
            slug: { type: string }
            basePrice: { type: [string, number] }
            currency: { default: USD }
            active: { default: true }
    Staff:
      type: object
      required: [id, name, role, branchId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        role: { type: string, enum: [ADMIN, CASHIER, BARISTA] }
        branchId: { type: [integer, 'null'], format: int64 }
